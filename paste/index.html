<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Cloud Gist Notepad</title>
</head>
<body>

<h2>Cloud Notepad (GitHub Gist)</h2>

<textarea id="noteInput" style="width:100%; height:150px;" placeholder="Type your note here..."></textarea><br>
<button onclick="addNewGist()">➕ Add Gist</button>

<h3>📄 My Added Gists</h3>
<ul id="gistList"></ul>

<script>
const token = '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'; // Replace with your GitHub Token

function addNewGist() {
  const content = document.getElementById('noteInput').value.trim();
  if (!content) {
    alert('Please enter some text!');
    return;
  }

  const data = {
    description: 'Cloud Notepad Entry',
    public: true,
    files: {
      "note.txt": { content: content }
    }
  };

  fetch('https://api.github.com/gists', {
    method: 'POST',
    headers: {
      'Authorization': 'token ' + token,
      'Accept': 'application/vnd.github.v3+json'
    },
    body: JSON.stringify(data)
  })
  .then(response => response.json())
  .then(gist => {
    if (gist.id) {
      appendGistToList(gist);
      document.getElementById('noteInput').value = '';
    } else {
      alert('Error creating gist!');
    }
  })
  .catch(err => {
    alert('Error: ' + err);
  });
}

function appendGistToList(gist) {
  const fileContent = gist.files['note.txt'].content;
  const li = document.createElement('li');
  li.innerHTML = `<a href="${gist.html_url}" target="_blank">${gist.id}</a>: 
                   <pre style="background:#f0f0f0; padding:5px;">${escapeHtml(fileContent)}</pre>`;
  document.getElementById('gistList').prepend(li);
}

function escapeHtml(text) {
  var map = {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  };
  return text.replace(/[&<>"']/g, function(m) { return map[m]; });
}
</script>

</body>
</html>
